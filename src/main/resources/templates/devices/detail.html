<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${device.name()})}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container py-3">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside><div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="page-heading"><div><a class="small text-decoration-none" th:href="@{/devices}">← Danh sách thiết bị</a><h1 class="mt-3" th:text="${device.name()}"></h1><p th:text="${device.serialNumber()}"></p></div><div th:if="${#authorization.expression('hasRole(''ADMIN'')') or device.ownerId() == #authentication.principal.user.id}" class="d-flex gap-2"><a class="btn btn-primary" th:href="@{/devices/{id}/edit(id=${device.id()})}">Chỉnh sửa</a><form th:if="${device.status().name() != 'INACTIVE'}" th:action="@{/devices/{id}/deactivate(id=${device.id()})}" method="post"><button class="btn btn-outline-warning">Ngừng hoạt động</button></form><form th:action="@{/devices/{id}/delete(id=${device.id()})}" method="post" data-confirm="Thiết bị có lịch sử cần Ngừng hoạt động trước khi xóa. Dữ liệu cũ sẽ được lưu. Tiếp tục?"><button class="btn btn-outline-danger">Xóa thiết bị</button></form></div></div>
    <p class="small text-muted">Thiết bị có lịch sử cần Ngừng hoạt động trước khi Xóa. Sau đó thiết bị sẽ ẩn khỏi danh sách, còn dữ liệu cũ được lưu lại.</p>
    <div class="row g-4"><div class="col-lg-4"><section class="panel"><img th:if="${device.imageUrl() != null}" th:src="${device.imageUrl()}" th:alt="${device.name()}" class="detail-image"><div th:unless="${device.imageUrl() != null}" class="empty-state"><div class="empty-icon">◈</div><p class="text-muted mb-0">Chưa có ảnh thiết bị</p></div></section></div>
    <div class="col-lg-8"><section class="panel"><div class="d-flex justify-content-between align-items-center"><h2 class="h5 mb-0">Thông tin chi tiết</h2><span th:replace="~{fragments/layout :: status(${device.status()})}"></span></div><dl class="row detail-grid"><div class="col-sm-6"><dt>Danh mục</dt><dd th:text="${device.categoryName()}"></dd></div><div class="col-sm-6"><dt>Vị trí</dt><dd th:text="${#strings.isEmpty(device.location()) ? 'Chưa cập nhật' : device.location()}"></dd></div><div class="col-sm-6"><dt>Chủ sở hữu</dt><dd th:text="${device.ownerName()}"></dd></div><div class="col-sm-6"><dt>Mã định danh</dt><dd th:text="${device.id()}"></dd></div><div class="col-sm-6"><dt>Ngày tạo (UTC)</dt><dd th:text="${device.createdAt()}"></dd></div><div class="col-sm-6"><dt>Cập nhật lần cuối (UTC)</dt><dd th:text="${device.updatedAt()}"></dd></div></dl><hr><h3 class="h6">Mô tả</h3><p class="description mb-0" th:text="${#strings.isEmpty(device.description()) ? 'Chưa có mô tả.' : device.description()}"></p></section></div></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
