<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Thiết bị')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-3">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <div class="page-heading"><div><div class="eyebrow mb-2">QUẢN LÝ IOT</div><h1>Danh sách thiết bị</h1><p>Theo dõi và quản lý thiết bị trong một không gian.</p></div><a class="btn btn-primary" th:href="@{/devices/new}">+ Thêm thiết bị</a></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <form class="panel mb-4" method="get" th:action="@{/devices}">
        <div class="row g-3 align-items-end">
            <div class="col-lg-4 col-md-6"><label for="q" class="form-label">Tìm thiết bị</label><input class="form-control" id="q" name="q" th:value="${q}" maxlength="120" placeholder="Nhập tên hoặc mã thiết bị…"></div>
            <div class="col-lg-3 col-md-6"><label for="categoryId" class="form-label">Danh mục</label><select class="form-select" id="categoryId" name="categoryId"><option value="">Tất cả danh mục</option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == categoryId}"></option></select></div>
            <div class="col-lg-3 col-md-6"><label for="status" class="form-label">Trạng thái</label><select class="form-select" name="status" id="status"><option value="">Tất cả trạng thái</option><option th:each="s : ${statuses}" th:value="${s}" th:selected="${s == status}" th:text="${s.name() == 'ACTIVE' ? 'Hoạt động' : (s.name() == 'MAINTENANCE' ? 'Bảo trì' : 'Ngừng hoạt động')}"></option></select></div>
            <div class="col-lg-2 col-md-6 d-flex gap-2"><button class="btn btn-primary" type="submit">Lọc</button><a class="btn btn-light" th:href="@{/devices}">Đặt lại</a></div>
        </div>
        <div class="d-flex gap-2 align-items-center mt-3"><label class="small text-muted" for="size">Số dòng mỗi trang</label><select class="form-select form-select-sm w-auto" id="size" name="size"><option th:each="n : ${ {10,20,50,100} }" th:value="${n}" th:text="${n}" th:selected="${n == size}"></option></select></div>
    </form>
    <section class="panel p-0 overflow-hidden" aria-label="Danh sách thiết bị">
        <div class="d-flex justify-content-between align-items-center p-3 border-bottom"><strong>Thiết bị <span class="badge text-bg-light ms-1" th:text="${devices.totalElements}"></span></strong><span class="small text-muted" th:text="${devices.totalPages == 0 ? 'Chưa có kết quả' : 'Trang ' + (devices.number + 1) + ' / ' + devices.totalPages}"></span></div>
        <div th:if="${devices.empty}" class="empty-state"><div class="empty-icon" aria-hidden="true">◈</div><h2 class="h4">Chưa có thiết bị để hiển thị</h2><p class="text-muted">Thêm thiết bị đầu tiên hoặc thử thay đổi bộ lọc.</p><a class="btn btn-outline-primary" th:href="@{/devices/new}">Thêm thiết bị</a></div>
        <div th:unless="${devices.empty}" class="table-responsive"><table class="table table-hover"><thead><tr><th scope="col">Thiết bị</th><th scope="col">Danh mục</th><th scope="col">Vị trí</th><th scope="col">Trạng thái</th><th scope="col" sec:authorize="hasRole('ADMIN')">Chủ sở hữu</th><th scope="col" class="text-end">Thao tác</th></tr></thead><tbody>
            <tr th:each="d : ${devices.content}">
                <td><div class="d-flex align-items-center gap-3"><img th:if="${d.imageUrl() != null}" class="device-thumb" th:src="${d.imageUrl()}" alt="" loading="lazy"><span th:unless="${d.imageUrl() != null}" class="device-thumb device-placeholder" aria-hidden="true">◈</span><div><a class="device-name" th:href="@{/devices/{id}(id=${d.id()})}" th:text="${d.name()}"></a><div class="small text-muted" th:text="${d.serialNumber()}"></div></div></div></td>
                <td th:text="${d.categoryName()}"></td><td th:text="${#strings.isEmpty(d.location()) ? 'Chưa cập nhật' : d.location()}"></td><td><span th:replace="~{fragments/layout :: status(${d.status()})}"></span></td><td sec:authorize="hasRole('ADMIN')" th:text="${d.ownerName()}"></td>
                <td><div th:if="${#authorization.expression('hasRole(''ADMIN'')') or d.ownerId() == #authentication.principal.user.id}" class="d-flex justify-content-end gap-2"><a class="btn btn-sm btn-outline-secondary" th:href="@{/devices/{id}/edit(id=${d.id()})}" th:aria-label="${'Sửa ' + d.name()}">Sửa</a><form th:if="${d.status().name() != 'INACTIVE'}" th:action="@{/devices/{id}/deactivate(id=${d.id()})}" method="post"><button class="btn btn-sm btn-outline-warning" th:aria-label="${'Ngừng hoạt động ' + d.name()}">Ngừng hoạt động</button></form><form th:action="@{/devices/{id}/delete(id=${d.id()})}" method="post" data-confirm="Thiết bị có lịch sử cần Ngừng hoạt động trước khi xóa. Dữ liệu cũ sẽ được lưu. Tiếp tục?"><button class="btn btn-sm btn-outline-danger" th:aria-label="${'Xóa ' + d.name()}">Xóa</button></form></div></td>
            </tr>
        </tbody></table></div>
        <nav th:if="${devices.totalPages > 1}" aria-label="Phân trang thiết bị" class="p-3"><ul class="pagination justify-content-center flex-wrap mb-0">
            <li class="page-item" th:classappend="${devices.first ? 'disabled' : ''}"><a class="page-link" th:href="@{/devices(page=0,size=${size},q=${q},categoryId=${categoryId},status=${status})}" aria-label="Trang đầu">«</a></li>
            <li class="page-item" th:each="p : ${#numbers.sequence(T(java.lang.Math).max(0, devices.number - 2), T(java.lang.Math).min(devices.totalPages - 1, devices.number + 2))}" th:classappend="${p == devices.number ? 'active' : ''}"><a class="page-link" th:href="@{/devices(page=${p},size=${size},q=${q},categoryId=${categoryId},status=${status})}" th:text="${p + 1}" th:attr="aria-current=${p == devices.number ? 'page' : null}"></a></li>
            <li class="page-item" th:classappend="${devices.last ? 'disabled' : ''}"><a class="page-link" th:href="@{/devices(page=${devices.totalPages - 1},size=${size},q=${q},categoryId=${categoryId},status=${status})}" aria-label="Trang cuối">»</a></li>
        </ul></nav>
    </section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
