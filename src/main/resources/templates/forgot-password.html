<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - IoT Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow" id="requestOtpCard">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Forgot Password</h3>
                    
                    <div id="alertBox1" class="alert d-none"></div>

                    <form id="forgotForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">Enter your email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning">Send OTP</button>
                        </div>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="/login" class="text-decoration-none">Back to Login</a>
                    </div>
                </div>
            </div>

            <div class="card shadow d-none" id="resetPasswordCard">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Reset Password</h3>
                    
                    <div id="alertBox2" class="alert d-none"></div>

                    <form id="resetForm">
                        <div class="mb-3">
                            <label for="otpCode" class="form-label">OTP Code</label>
                            <input type="text" class="form-control" id="otpCode" required maxlength="6">
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">New Password</label>
                            <input type="password" class="form-control" id="newPassword" required minlength="6">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Reset Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentEmail = "";

document.getElementById("forgotForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const email = document.getElementById("email").value;
    const alertBox1 = document.getElementById("alertBox1");

    try {
        const res = await fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });
        
        const data = await res.json();
        
        if (res.ok) {
            currentEmail = email;
            document.getElementById("requestOtpCard").classList.add("d-none");
            document.getElementById("resetPasswordCard").classList.remove("d-none");
            
            const alertBox2 = document.getElementById("alertBox2");
            alertBox2.classList.remove("d-none", "alert-danger");
            alertBox2.classList.add("alert-success");
            alertBox2.innerText = data.message;
        } else {
            alertBox1.classList.remove("d-none", "alert-success");
            alertBox1.classList.add("alert-danger");
            alertBox1.innerText = data.error || "Failed to send OTP!";
        }
    } catch (err) {
        alert("An error occurred");
    }
});

document.getElementById("resetForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const otpCode = document.getElementById("otpCode").value;
    const newPassword = document.getElementById("newPassword").value;
    const alertBox2 = document.getElementById("alertBox2");

    try {
        const res = await fetch("/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: currentEmail, otpCode, newPassword })
        });
        
        const data = await res.json();
        alertBox2.classList.remove("d-none");
        
        if (res.ok) {
            alertBox2.classList.remove("alert-danger");
            alertBox2.classList.add("alert-success");
            alertBox2.innerHTML = data.message + ' <a href="/login">Login now</a>';
        } else {
            alertBox2.classList.remove("alert-success");
            alertBox2.classList.add("alert-danger");
            alertBox2.innerText = data.error || "Reset failed!";
        }
    } catch (err) {
        alert("An error occurred");
    }
});
</script>

</body>
</html>
