<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Cấu hình và nhật ký hệ thống')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container py-4"><h1>Cấu hình và nhật ký hệ thống</h1><div id="message" class="alert d-none" role="status"></div><div class="row g-4"><section class="col-lg-4"><form id="settingsForm" class="panel"><h2 class="h5">Cảnh báo nhiệt độ</h2><label for="threshold">Ngưỡng (°C)</label><input type="number" step="0.1" min="-50" max="150" id="threshold" class="form-control mb-3" required><button class="btn btn-primary">Lưu cấu hình</button></form><form id="supplierForm" class="panel mt-3"><h2 class="h5">Nhà cung cấp</h2><input type="hidden" id="supplierId"><label for="supplierName">Tên</label><input id="supplierName" class="form-control mb-2" maxlength="100" required><label for="supplierContact">Liên hệ</label><input id="supplierContact" class="form-control mb-2" maxlength="200"><label for="supplierDescription">Mô tả</label><textarea id="supplierDescription" class="form-control mb-3" maxlength="500"></textarea><button class="btn btn-primary">Lưu</button><button type="reset" class="btn btn-outline-secondary" onclick="document.getElementById('supplierId').value=''">Thêm mới</button></form></section><section class="col-lg-8"><div class="panel table-responsive"><h2 class="h5">Danh sách nhà cung cấp</h2><table class="table"><thead><tr><th>Tên</th><th>Liên hệ</th><th>Thao tác</th></tr></thead><tbody id="suppliersBody"></tbody></table></div></section></div><section class="panel table-responsive mt-4"><h2 class="h5">Nhật ký quản trị</h2><table class="table"><thead><tr><th>Thời gian</th><th>Tài khoản</th><th>Hành động</th><th>Chi tiết</th></tr></thead><tbody id="logsBody"></tbody></table><button id="prevLogs" class="btn btn-outline-secondary">Trước</button><span id="logPage" class="mx-3"></span><button id="nextLogs" class="btn btn-outline-secondary">Sau</button></section></main><footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block><script src="/js/management.js"></script></body></html>
