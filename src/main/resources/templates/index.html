<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Home - IoT Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">IoT Management</a>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item" sec:authorize="!isAuthenticated()">
            <a class="nav-link" href="/login">Login</a>
        </li>
        <li class="nav-item" sec:authorize="!isAuthenticated()">
            <a class="nav-link" href="/register">Register</a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
            <a class="nav-link" href="#">Hello, <span sec:authentication="name"></span></a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link text-warning fw-bold" href="#">[Admin Menu]</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('MANAGER')">
            <a class="nav-link text-info fw-bold" href="#">[Manager Menu]</a>
        </li>
        <li class="nav-item" sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="nav-link btn btn-danger text-white ms-2 border-0">Logout</button>
            </form>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5 text-center">
    <h1>Welcome to IoT Device Management System</h1>
    <p class="lead" sec:authorize="!isAuthenticated()">Please login to manage your devices.</p>
    <p class="lead" sec:authorize="isAuthenticated()">You are successfully logged in!</p>
</div>

</body>
</html>
