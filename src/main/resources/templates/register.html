<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - IoT Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body" id="registerSection">
                    <h3 class="card-title text-center mb-4">Register</h3>
                    
                    <div id="alertBox" class="alert d-none"></div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" name="fullName" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required minlength="6">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success">Register</button>
                        </div>
                    </form>
                    
                    <div class="mt-3 text-center">
                        <a href="/login" class="text-decoration-none">Already have an account? Login</a>
                    </div>
                </div>

                <div class="card-body d-none" id="verifySection">
                    <h3 class="card-title text-center mb-4">Verify Account</h3>
                    
                    <div id="verifyAlertBox" class="alert alert-success">
                        Please check your email for the OTP code.
                    </div>

                    <form id="verifyForm">
                        <div class="mb-3">
                            <label for="otpCode" class="form-label">OTP Code</label>
                            <input type="text" class="form-control" id="otpCode" required maxlength="6">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Verify & Login</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let registeredEmail = "";

document.getElementById("registerForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const fullName = document.getElementById("fullName").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const alertBox = document.getElementById("alertBox");

    try {
        const res = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fullName, email, password })
        });
        
        const data = await res.json();
        alertBox.classList.remove("d-none");
        
        if (res.ok) {
            registeredEmail = email;
            document.getElementById("registerSection").classList.add("d-none");
            document.getElementById("verifySection").classList.remove("d-none");
        } else {
            alertBox.classList.remove("alert-success");
            alertBox.classList.add("alert-danger");
            let errorMsg = data.error || "Registration failed!";
            // Handle validation errors format
            if(typeof data === 'object' && !data.error && !data.message) {
                errorMsg = Object.values(data).join(', ');
            }
            alertBox.innerText = errorMsg;
        }
    } catch (err) {
        alert("An error occurred");
    }
});

document.getElementById("verifyForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const otpCode = document.getElementById("otpCode").value;
    const alertBox = document.getElementById("verifyAlertBox");

    try {
        const res = await fetch("/api/auth/verify-account", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: registeredEmail, otpCode })
        });
        
        const data = await res.json();
        
        if (res.ok) {
            alertBox.classList.remove("alert-danger");
            alertBox.classList.add("alert-success");
            alertBox.innerHTML = data.message + ' <a href="/login">Click here to Login</a>';
        } else {
            alertBox.classList.remove("alert-success");
            alertBox.classList.add("alert-danger");
            alertBox.innerText = data.error || "Verification failed!";
        }
    } catch (err) {
        alert("An error occurred");
    }
});
</script>

</body>
</html>
