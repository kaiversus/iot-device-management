<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Tài khoản cá nhân')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container py-4"><h1>Tài khoản cá nhân</h1><div id="message" class="alert d-none" role="status"></div><div class="row g-4"><section class="col-md-6"><form id="profileForm" class="panel"><h2 class="h5">Thông tin cá nhân</h2><p id="accountInfo"></p><label class="form-label" for="fullName">Họ và tên</label><input id="fullName" class="form-control mb-3" maxlength="100" required><button class="btn btn-primary">Lưu thông tin</button></form></section><section class="col-md-6"><form id="passwordForm" class="panel"><h2 class="h5">Đổi mật khẩu</h2><label for="currentPassword">Mật khẩu hiện tại</label><input type="password" id="currentPassword" class="form-control mb-3" autocomplete="current-password" required><label for="newPassword">Mật khẩu mới</label><input type="password" id="newPassword" class="form-control mb-3" autocomplete="new-password" minlength="6" maxlength="72" required><button class="btn btn-primary">Đổi mật khẩu</button><p class="small mt-3">Sau khi đổi, bạn cần đăng nhập lại trên các thiết bị.</p></form></section></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block><script src="/js/management.js"></script></body></html>
