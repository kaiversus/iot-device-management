<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Dashboard realtime')}"></head>
<body class="bg-light" th:attr="data-admin=${dashboardAdmin}">

<header th:replace="~{fragments/layout :: header}"></header><div class="container mt-3"><span id="wsStatus" class="badge bg-secondary">Đang kết nối...</span></div>

<div class="container my-4">
    <div id="loadError" role="alert" class="alert alert-warning d-none"></div>
    <div class="alert alert-info">Tổng thiết bị: <strong id="statTotal">0</strong> · Bật: <strong id="statActive">0</strong> · Tắt: <strong id="statInactive">0</strong> · Bảo trì: <strong id="statMaintenance">0</strong></div>
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3"><div class="card text-center shadow-sm"><div class="card-body">
            <div class="text-muted small">Thiết bị đã có dữ liệu</div><div class="fs-2 fw-bold" id="statDevices">0</div></div></div></div>
        <div class="col-6 col-md-3"><div class="card text-center shadow-sm"><div class="card-body">
            <div class="text-muted small">Tổng bản ghi</div><div class="fs-2 fw-bold" id="statRecords">0</div></div></div></div>
        <div class="col-6 col-md-3"><div class="card text-center shadow-sm"><div class="card-body">
            <div class="text-muted small">Số cảnh báo</div><div class="fs-2 fw-bold text-danger" id="statAlerts">0</div></div></div></div>
        <div class="col-6 col-md-3"><div class="card text-center shadow-sm"><div class="card-body">
            <div class="text-muted small">Ngưỡng nhiệt độ (°C)</div><div class="fs-2 fw-bold" id="statThreshold">-</div></div></div></div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header d-flex align-items-center gap-2">
            <strong class="me-auto">Nhiệt độ &amp; độ ẩm theo thời gian thực</strong>
            <label for="deviceFilter" class="small mb-0">Thiết bị ID:</label>
            <input id="deviceFilter" type="number" min="1" class="form-control form-control-sm" style="width:90px" placeholder="Tất cả">
        </div>
        <div class="card-body"><canvas id="tempChart" height="110"></canvas></div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header"><strong>Cảnh báo gần đây</strong></div>
        <div class="table-responsive">
            <table class="table table-sm mb-0">
                <thead><tr><th>Thời gian</th><th>Thiết bị</th><th>Nội dung</th></tr></thead>
                <tbody id="alertBody"><tr><td colspan="3" class="text-muted">Chưa có cảnh báo</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<div id="toastArea" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

<footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
