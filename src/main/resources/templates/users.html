<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Quản lý người dùng')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container py-4"><h1>Quản lý người dùng</h1><div id="message" class="alert d-none" role="status"></div><p>Manager quản lý User trong khu vực được Admin phân công. Chỉ Admin thay đổi quyền và khu vực.</p><button id="showCreateUser" type="button" class="btn btn-primary mt-2">Thêm người dùng</button><form id="createUser" class="panel mt-3" hidden><h2 class="h5">Thêm người dùng</h2><label for="newEmail">Email</label><input id="newEmail" type="email" class="form-control mb-2" maxlength="100" required><label for="newName">Họ tên</label><input id="newName" class="form-control mb-2" maxlength="100" required><label for="newPassword">Mật khẩu ban đầu</label><input id="newPassword" type="password" class="form-control mb-2" minlength="6" maxlength="72" autocomplete="new-password" required><label for="newRegion">Khu vực</label><input id="newRegion" class="form-control mb-2" maxlength="80"><label for="newRole">Quyền</label><select id="newRole" class="form-select mb-2"><option value="ROLE_USER">User</option><option value="ROLE_MANAGER">Manager</option><option value="ROLE_ADMIN">Admin</option></select><p class="small text-muted">Tài khoản dùng được ngay. Hãy chuyển mật khẩu ban đầu cho người dùng và yêu cầu họ đổi mật khẩu.</p><button class="btn btn-primary">Tạo tài khoản</button><button id="cancelCreateUser" type="button" class="btn btn-outline-secondary ms-2">Hủy</button></form><form id="searchUsers" class="d-flex gap-2 my-3"><input id="query" class="form-control" maxlength="100" placeholder="Tìm theo email hoặc họ tên" aria-label="Từ khóa"><button class="btn btn-primary">Tìm</button></form><div class="table-responsive panel"><table class="table"><thead><tr><th>Email</th><th>Họ tên</th><th>Khu vực</th><th>Quyền</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="usersBody"></tbody></table><div class="d-flex gap-3"><button id="prevUsers" class="btn btn-outline-secondary">Trước</button><span id="userPage"></span><button id="nextUsers" class="btn btn-outline-secondary">Sau</button></div></div><form id="editUser" class="panel mt-3" hidden><h2 class="h5">Chỉnh sửa người dùng</h2><input type="hidden" id="userId"><label for="userName">Họ tên</label><input id="userName" class="form-control mb-2" maxlength="100" required><label for="userRegion">Khu vực</label><input id="userRegion" class="form-control mb-2" maxlength="80"><label for="userRole">Quyền</label><select id="userRole" class="form-select mb-2"><option value="ROLE_USER">User</option><option value="ROLE_MANAGER">Manager</option><option value="ROLE_ADMIN">Admin</option></select><label class="d-block mb-3"><input id="userLocked" type="checkbox"> Khóa tài khoản</label><button class="btn btn-primary">Lưu thay đổi</button></form></main><footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block><script src="/js/management.js"></script></body></html>
